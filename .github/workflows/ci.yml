name: CI
on: [push, pull_request]
jobs:
  core-linux:
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - run: swift build --target CommittoCore -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors
      - run: swift test
      # LeakSanitizer is off on Linux: it reports one-time Foundation/libdispatch allocations (~0.5 MB) that are not ours.
      - run: swift test --sanitize=address
        env:
          ASAN_OPTIONS: detect_leaks=0
      # act (ACT=true) runs this job in an arm64 Linux VM where TSan cannot start; GitHub's x86_64 runner is the reference.
      - run: swift test --sanitize=thread
        if: ${{ !env.ACT }}
  app-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift build -c release
      - run: swift test
      - run: swift test --sanitize=address
      - run: swift test --sanitize=thread
      - run: swift test --sanitize=undefined
